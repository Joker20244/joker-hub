<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>تحدي المعلومات | الملك جوكر</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="core.css"></head><body>
<main><div class="card"><div class="row" id="cs"></div></div><div class="card" id="qb" style="text-align:center"></div><div class="grid g3"><div class="card"><div class="mut">أعلى نتيجة</div><div class="big" id="hi">0</div></div><div class="card"><div class="mut">آخر نتيجة</div><div class="big" id="la">—</div></div><div class="card"><div class="mut">ألعاب لعبتها</div><div class="big" id="pl">0</div></div></div></main>
<script>const SITE={"id": "quiz", "title": "تحدي المعلومات", "icon": "🎯", "ac": "#ff4d6d"};</script><script src="core.js"></script>
<script>const Q={'اختراعات بالصدفة':[['مين اخترع الميكروويف بالصدفة؟',['بيرسي سبنسر','إديسون','تسلا','بيل'],0],['فليمنج اكتشف إيه من طبق منسي؟',['الأنسولين','البنسلين','الأشعة','الدينامو'],1],['الأشعة السينية اتكتشفت سنة؟',['1895','1950','1801','1990'],0],['اختراع الورقة اللاصقة (بوست إت) كان من غراء...',['فاشل','سام','لاصق جدًا','ملون'],0],['التفلون اتكتشف أثناء تجارب على...',['غازات التبريد','الأدوية','الطعام','الحبر'],0]],
'فضاء وعلوم':[['أقرب كوكب للشمس؟',['الزهرة','عطارد','المريخ','الأرض'],1],['الكوكب الأحمر؟',['المشتري','زحل','المريخ','نبتون'],2],['عدد كواكب المجموعة الشمسية؟',['7','8','9','10'],1],['أسرع حاجة في الكون؟',['الصوت','الضوء','القطر','الصاروخ'],1],['الغاز اللي بنتنفسه أكتر في الجو؟',['أكسجين','نيتروجين','هيدروجين','ثاني أكسيد الكربون'],1]],
'كورة':[['أكتر نادي فاز بدوري الأبطال؟',['برشلونة','ريال مدريد','ميلان','ليفربول'],1],['كام لاعب في فريق الكورة جوه الملعب؟',['9','10','11','12'],2],['كأس العالم 2022 اتعملت في؟',['قطر','روسيا','البرازيل','مصر'],0],['ملعب برشلونة اسمه؟',['سانتياجو برنابيو','كامب نو','أنفيلد','الأولد ترافورد'],1],['مين كابتن مصر الأشهر وأفضل لاعب؟',['محمد صلاح','أحمد حسن','حسام غالي','الشناوي'],0]],
'مصر وتاريخ':[['اسم أكبر هرم في الجيزة؟',['خوفو','منقرع','خفرع','زوسر'],0],['عاصمة مصر؟',['الإسكندرية','القاهرة','الأقصر','أسوان'],1],['معبد أبو سمبل بتاع الملك؟',['رمسيس الثاني','توت عنخ آمون','أحمس','خوفو'],0],['أطول نهر في مصر؟',['النيل','الفرات','الأمازون','الراين'],0],['سنة افتتاح قناة السويس؟',['1869','1952','1914','1798'],0]]};
let cat=null,qs=[],i=0,sc=0;
function init(){$('#cs').innerHTML=Object.keys(Q).map(k=>'<button class="chip" data-c="'+k+'">'+k+'</button>').join('')+'<button class="chip on" data-c="*">🎲 خليط</button>';$$('#cs button').forEach(b=>b.onclick=()=>start(b.dataset.c));
$('#qb').innerHTML='<p>اختار قسم وابدأ التحدي! 5 أسئلة وتحسب نتيجتك 🔥</p>';stats()}
function stats(){$('#hi').textContent=store.get('hi',0);$('#la').textContent=store.get('la','—');$('#pl').textContent=store.get('pl',0)}
function start(c){let a=c=='*'?Object.values(Q).flat():Q[c];qs=[...a].sort(()=>Math.random()-.5).slice(0,5);i=0;sc=0;ask()}
function ask(){const q=qs[i],o=q[1].map((t,k)=>[t,k]).sort(()=>Math.random()-.5);$('#qb').innerHTML='<div class="mut">سؤال '+(i+1)+' من '+qs.length+' • نتيجتك '+sc+'</div><h2>'+esc(q[0])+'</h2><div class="grid g2">'+o.map(([t,k])=>'<button data-k="'+k+'" style="padding:14px">'+esc(t)+'</button>').join('')+'</div>';
$$('#qb [data-k]').forEach(b=>b.onclick=()=>{const ok=+b.dataset.k==q[2];if(ok)sc++;$$('#qb [data-k]').forEach(x=>{x.disabled=true;if(+x.dataset.k==q[2])x.style.background='#4ade80',x.style.color='#111'});if(!ok)b.style.background='#ff4d6d';setTimeout(()=>{i++;i<qs.length?ask():end()},900)})}
function end(){store.set('la',sc+'/'+qs.length);store.set('pl',store.get('pl',0)+1);if(sc>store.get('hi',0))store.set('hi',sc);stats();$('#qb').innerHTML='<div class="big" style="font-size:3rem">'+sc+'/'+qs.length+'</div><h2>'+(sc==qs.length?'أسطورة! 👑':sc>=3?'حلو جدًا 🔥':'جرب تاني 💪')+'</h2><p class="mut">اختار قسم من فوق وعيد.</p>'}</script></body></html>
